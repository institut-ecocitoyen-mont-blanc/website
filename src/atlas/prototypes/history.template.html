<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

14px}.card{display:flex;flex-direction:column;text-align:left;padding:18px;min-width:0;position:relative}.card h3{font-size:15px;min-height:44px;line-height:1.4}.card .value{font-size:27px;margin-top:12px;font-weight:700;letter-spacing:-.03em}.unit{font-size:13px;font-weight:450;letter-spacing:0;color:var(--muted)}.card .date{font-size:11px;color:var(--muted)}.spark{width:100%;height:62px;display:block;overflow:visible;margin:14px 0 6px}.sparkText{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}.card .openLabel{margin-top:15px;font-size:12px;color:var(--blue);font-weight:650}.card[aria-pressed=true]{background:#f8fbff;box-shadow:inset 0 0 0 1px var(--blue)}.panel{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:24px;background:white}.panel h3{font-size:21px}.panel .meta{font-size:12px;margin:3px 0;color:var(--muted)}.panelHead{display:flex;justify-content:space-between;align-items:start;gap:14px}.close{padding:5px 10px;border:none;color:var(--muted);font-size:20px}.range{display:flex;flex-wrap:wrap;gap:5px;margin:18px 0 6px}.range button{font-size:12px;padding:5px 10px}.graph{width:100%;display:block;overflow:visible}.chartBox{margin-top:12px}.point:hover{stroke:var(--ink);stroke-width:3}.readout{padding:9px 12px;background:var(--soft);border-radius:8px;font-size:12px;min-height:39px}.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:11px;margin-top:14px}.dot{color:var(--blue)}.bound{color:var(--amber)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 0 0}.emptyChart{padding:36px 12px;text-align:center;background:var(--soft);border-radius:10px;margin:15px 0;color:var(--muted)}.tableWrap{overflow:auto;max-height:310px;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{background:var(--soft);position:sticky;top:0;font-weight:600;color:var(--muted)}details{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--blue)}.footer{padding:20px 36px;background:#fafbfd;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.footer p{margin:4px 0}.row{width:100%;display:grid;grid-template-columns:minmax(140px,1fr) 110px 150px 20px;gap:20px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:16px 4px}.row h3{font-size:15px}.row .spark{height:36px;margin:0}.row .reading{text-align:right;font-weight:650}.row .reading small{display:block;font-weight:400;color:var(--muted);font-size:10px}.row .hint{font-size:11px;color:var(--muted)}.row .chevron{color:var(--blue)}.row[aria-pressed=true]{background:var(--soft)}.listPanel{margin:0 0 14px;border-top:0;border-radius:0 0 12px 12px;background:#fbfcfe}.search{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;margin-bottom:12px;background:white}.explorer{display:grid;grid-template-columns:235px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}.rail{background:var(--soft);padding:14px;border-right:1px solid var(--line)}.rail button{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px;background:transparent;border-color:transparent}.rail button[aria-pressed=true]{background:white;border-color:var(--line);box-shadow:0 3px 10px #243b5308}.rail h3{font-size:13px}.rail .spark{height:32px;margin:7px 0}.rail .miniValue{font-size:11px;color:var(--muted)}.explorer .panel{border:0;border-radius:0;margin:0;padding:22px;min-width:0}.switcher{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#172239;color:white;border-radius:16px;padding:9px;box-shadow:0 5px 24px #17223933;white-space:nowrap}.switcher button{color:white;background:transparent;border:0;padding:8px 12px}.switcher button:hover{background:#ffffff18}.switcher select{background:#25354e;color:white;border:0;border-radius:8px;padding:8px}.state{font-size:10px;text-align:center;color:var(--muted);padding-top:14px}.single{font-size:11px;color:var(--muted);padding:19px 0}.summaryLine{font-size:13px;color:var(--muted);margin-bottom:20px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lab{flex-direction:column;align-items:stretch;padding:0 14px;margin-top:15px;gap:8px}.lab select{width:100%}main{border-radius:16px;margin:0 10px 110px}.head,.body{padding:22px}.head h1{font-size:27px}.footer{padding:20px}.explorer{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:8px}.rail button{flex:0 0 150px;margin:0}.rail .search{display:none}.row{grid-template-columns:minmax(100px,1fr) 85px 80px 10px;gap:8px}.panel{padding:16px}.switcher{max-width:95%;bottom:12px}.switcher select{max-width:220px}.graph{min-height:180px}.panel h3{font-size:18px}.sectionHead{flex-wrap:wrap}}@media(max-width:420px){.body{padding:18px 14px}.head{padding:22px 18px}.card{padding:13px}.card h3{font-size:13px}.card .value{font-size:23px}.row{grid-template-columns:1fr 75px 65px 10px}.row h3{font-size:13px}.row .reading{font-size:12px}.sparkText{font-size:10px}.panelHead{gap:4px}}
</style></head><body>
<div class="lab"><div><strong>ATELIER ATLAS</strong> <span> · Trois propositions · données réelles</span></div><label><span class="muted">Site </span><select id="site" aria-label="Choisir un site"></select></label></div>
<main><header class="head" id="header"></header><div class="body" id="content"></div><footer class="footer" id="footer"></footer></main>
<nav class="switcher" aria-label="Variantes du prototype"><button id="prev" aria-label="Proposition précédente">←</button><select id="variant" aria-label="Proposition"><option value="cards">1 · Cartes avec sparklines</option><option value="list">2 · Liste dépliable</option><option value="explorer">3 · Explorateur d’historique</option></select><button id="next" aria-label="Proposition suivante">→</button></nav>
<script id="data" type="application/json">__EMBEDDED_DATA__</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':new Intl.NumberFormat('fr-FR',{maximumFractionDigits:5}).format(n);
const date=s=>new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris'}).format(new Date(s));
const year=s=>new Date(s).getUTCFullYear();
const variants=['cards','list','explorer'];const query=new URLSearchParams(location.search);
let variant=variants.includes(query.get('variant'))?query.get('variant'):'cards';
let siteIndex=Math.max(0,DATA.sites.findIndex(s=>s.key===query.get('site'))),selected=-1,period='all',search='';
const site=()=>DATA.sites[siteIndex];const reading=p=>p.qualifier==='?'?(p.text||'Non représentable'):`${p.qualifier==='='?'':p.qualifier+' '}${fmt(p.value)}`;
const drop='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C9 7 5 10 5 15a7 7 0 0014 0c0-5-4-8-7-13z"/><path d="M8 15c0 3 2 4 4 4"/></svg>';
document.getElementById('site').innerHTML=DATA.sites.map((s,i)=>`<option value="${i}">${esc(s.title)}</option>`).join('');
function pointsFor(g){if(period==='all')return g.points;const end=Date.parse(g.points.at(-1).date);const start=new Date(end);start.setUTCFullYear(start.getUTCFullYear()-Number(period));return g.points.filter(p=>Date.parse(p.date)>=start.getTime())}
function chart(g,small=false){
 const all=small?g.points:pointsFor(g),valid=all.filter(p=>p.value!==null&&p.qualifier!=='?');
 if(!valid.length)return `<div class="${small?'single':'emptyChart'}">Aucune valeur numérique représentable</div>`;
 if(small&&all.length===1)return '<div class="single">Une seule mesure · pas de tendance</div>';
 const w=small?220:720,h=small?60:260,l=small?4:58,r=small?4:20,t=small?5:24,b=small?5:37;
 let xmin=Math.min(...all.map(p=>Date.parse(p.date))),xmax=Math.max(...all.map(p=>Date.parse(p.date)));
 let ymin=Math.min(...valid.map(p=>p.value)),ymax=Math.max(...valid.map(p=>p.value));
 if(ymin===ymax){const pad=Math.max(Math.abs(ymin)*.15,.01);ymin-=pad;ymax+=pad}else{const pad=(ymax-ymin)*.12;ymin-=pad;ymax+=pad}ymin=Math.max(0,ymin);
 const x=p=>xmin===xmax?w/2:l+(Date.parse(p.date)-xmin)/(xmax-xmin)*(w-l-r),y=v=>h-b-(v-ymin)/(ymax-ymin)*(h-t-b);
 let axes='';if(!small){for(let i=0;i<4;i++){const v=ymin+(ymax-ymin)*i/3;axes+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="#e4eaf2"/><text x="${l-10}" y="${y(v)+4}" text-anchor="end" fill="#667893" font-size="11">${fmt(v)}</text>`}axes+=`<text x="${l}" y="${h-8}" fill="#667893" font-size="11">${date(new Date(xmin))}</text>${xmin!==xmax?`<text x="${w-r}" y="${h-8}" text-anchor="end" fill="#667893" font-size="11">${date(new Date(xmax))}</text>`:''}<text x="${l}" y="12" fill="#667893" font-size="11">${esc(g.unit)}</text>`}
 // Straight segments are visual guides only. A censored/unusable result breaks the line.
 let lines='',last=null;for(const p of all){if(p.qualifier==='='&&p.value!==null){if(last&&Date.parse(p.date)-Date.parse(last.date)<2*365.25*86400000)lines+=`M${x(last)},${y(last.value)}L${x(p)},${y(p.value)} `;last=p}else last=null}
 const dots=valid.map(p=>{const tip=`${date(p.date)} · ${reading(p)} ${g.unit} · ${p.status}`;const a=small?'':` tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}"`;return p.qualifier==='='?`<circle class="point" cx="${x(p)}" cy="${y(p.value)}" r="${small?2:3.8}" fill="#206bb6"${a}><title>${esc(tip)}</title></circle>`:`<path class="point" d="M${x(p)-4},${y(p.value)+(p.qualifier.startsWith('>')?-4: -3)} l8,0 l-4,${p.qualifier.startsWith('>')?-7:7}z" fill="white" stroke="#9a6526" stroke-width="1.5"${a}><title>${esc(tip)} · borne, pas une concentration mesurée</title></path>`}).join('');
 return `<svg class="${small?'spark':'graph'}" viewBox="0 0 ${w} ${h}" ${small?'aria-hidden="true"':`role="group" aria-label="Historique de ${esc(g.name)}"`}>${axes}<path d="${lines}" fill="none" stroke="#206bb6" stroke-width="${small?1.6:1.5}" opacity=".65"/>${dots}</svg>`;
}
function panel(index,extra=''){
 const g=site().series[index],rows=pointsFor(g),n=rows.filter(p=>p.qualifier==='='&&p.value!==null).length,bounds=rows.filter(p=>p.qualifier!=='='&&p.qualifier!=='?').length;
 return `<section class="panel ${extra}" id="detail"><div class="panelHead"><div><div class="eyebrow">Historique des analyses</div><h3>${esc(g.name)}</h3><p class="meta">${esc(g.fraction)}${g.context?' · '+esc(g.context):''} · code ${esc(g.code)} · ${esc(g.unit)}</p></div>${variant!=='explorer'?'<button class="close" id="close" aria-label="Fermer le graphique">×</button>':''}</div><div class="range" aria-label="Période">${[['all','Tout l’historique'],['10','10 dernières années'],['5','5 dernières années']].map(([v,label])=>`<button data-period="${v}" aria-pressed="${period===v}">${label}</button>`).join('')}</div><p class="meta">${rows.length} résultats · ${n} valeurs mesurées · ${bounds} bornes${rows.length-n-bounds?` · ${rows.length-n-bounds} non représentables`:''}</p><div class="chartBox">${chart(g)}</div><div class="readout" id="readout" aria-live="polite">${rows.length===1?'Une seule analyse : aucune évolution ne peut être déduite.':'Survolez un point ou utilisez la touche Tab pour lire son résultat.'}</div><div class="legend"><span><b class="dot">●</b> Valeur mesurée</span><span><b class="bound">▽ △</b> Borne &lt; / &gt; publiée, pas une mesure exacte</span></div><p class="note">Les traits guident la lecture, sans interpolation entre prélèvements. Les dates sont espacées à l’échelle du temps. Aucune mesure absente n’est remplacée par zéro. Les fenêtres de 5 et 10 ans se terminent au dernier prélèvement disponible.</p><details><summary>Voir les ${rows.length} résultats de cette période</summary><div class="tableWrap"><table><thead><tr><th>Prélèvement</th><th>Résultat</th><th>Qualification / remarque</th>${site().kind==='drinking'?'<th>Repères publiés</th>':''}</tr></thead><tbody>${[...rows].reverse().map(p=>`<tr><td>${date(p.date)}</td><td>${esc(reading(p))} ${esc(g.unit)}</td><td>${esc(p.status)}${p.remark?'<br>'+esc(p.remark):''}</td>${site().kind==='drinking'?`<td>${esc(p.reference||'Non renseigné')}</td>`:''}</tr>`).join('')}</tbody></table></div></details></section>`;
}
function card(g,i){const p=g.points.at(-1);return `<button class="card" data-series="${i}" aria-pressed="${selected===i}" aria-label="Voir l’historique : ${esc(g.name)}, ${esc(g.unit)}, ${esc(g.context)}"><h3>${esc(g.name)}</h3><div class="value">${esc(reading(p))} <span class="unit">${esc(g.unit)}</span></div><div class="date">Dernier résultat · ${date(p.date)}${g.context?' · '+esc(g.context):''}</div>${chart(g,true)}<div class="sparkText"><span>${year(g.points[0].date)}–${year(p.date)}</span><span>${g.points.length} résultats</span></div><span class="openLabel">Explorer l’évolution ↗</span></button>`}
function matches(g){return `${g.name} ${g.code} ${g.code==='5980'?'PFBA PFAS':g.code==='5979'?'PFPeA PFAS':''}`.toLowerCase().includes(search.toLowerCase())}
function render(){
 const s=site();if(variant==='explorer'&&selected<0)selected=0;
 document.getElementById('variant').value=variant;document.getElementById('site').value=siteIndex;
 document.getElementById('header').innerHTML=`<div class="eyebrow">${drop}${esc(s.source)}</div><h1>${esc(s.title)}</h1><p>${esc(s.place)} · Historique publié, pas un état en temps réel</p>`;
 const intro=`<div class="sectionHead"><div><h2>L’évolution au fil des analyses</h2><p>${variant==='cards'?'Un aperçu par paramètre. Cliquez pour explorer.':variant==='list'?'Repérez un paramètre, puis dépliez son historique.':'Passez d’un paramètre à l’autre sans quitter le graphique.'}</p></div><span class="tag">${s.series.length} séries dans ce prototype</span></div>`;
 let body='';
 if(variant==='cards')body=`<div class="cards">${s.series.map(card).join('')}</div>${selected>=0?panel(selected):''}`;
 if(variant==='list')body=`<input class="search" id="search" type="search" placeholder="Rechercher un paramètre, PFAS, un code…" aria-label="Rechercher une série" value="${esc(search)}"><div>${s.series.map((g,i)=>{if(!matches(g))return '';const p=g.points.at(-1);return `<button class="row" data-series="${i}" aria-pressed="${selected===i}" aria-expanded="${selected===i}"><span><h3>${esc(g.name)}</h3><span class="hint">${g.points.length} résultats · ${year(g.points[0].date)}–${year(p.date)}${g.context?' · '+esc(g.context):''}</span></span><span class="reading">${esc(reading(p))}<small>${esc(g.unit)} · ${date(p.date)}</small></span><span>${chart(g,true)}</span><span class="chevron">${selected===i?'−':'+'}</span></button>${selected===i?panel(i,'listPanel'):''}`}).join('')||'<p class="muted">Aucune série correspondante dans cet aperçu.</p>'}</div>`;
 if(variant==='explorer')body=`<div class="explorer"><aside class="rail" aria-label="Paramètres">${s.series.map((g,i)=>`<button data-series="${i}" aria-pressed="${selected===i}"><h3>${esc(g.name)}</h3>${chart(g,true)}<div class="miniValue">${esc(reading(g.points.at(-1)))} ${esc(g.unit)}${g.context?' · '+esc(g.context):''}</div></button>`).join('')}</aside>${panel(selected)}</div>`;
 document.getElementById('content').innerHTML=intro+body+`<div class="state">Prototype ${variants.indexOf(variant)+1}/3 · ${esc(s.key)} · ${selected>=0?'série '+esc(s.series[selected].code):'aucune série ouverte'} · période ${period==='all'?'complète':period+' ans'}</div>`;
 document.getElementById('footer').innerHTML=`<p><strong>Prototype de présentation · données réelles, sélection de paramètres.</strong> ${s.archiveCount.toLocaleString('fr-FR')} analyses dans l’archive source. Toutes les dates des séries sélectionnées sont conservées ; fractions, unités et contextes d’analyse distincts restent séparés.</p><p>Snapshot importé le ${s.importedAt?date(s.importedAt):'—'} · extrait pour cet aperçu le ${date(DATA.retrievedAt)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">Source : dépôt public IEC ↗</a></p><p>Ces graphiques ne constituent pas une évaluation sanitaire. Les courbes ont chacune leur échelle ; une hauteur de sparkline ne permet pas de comparer deux substances.</p>`;
 document.querySelectorAll('[data-series]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.series);selected=selected===i&&variant!=='explorer'?-1:i;period='all';render();if(variant==='cards'&&selected>=0)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});});
 document.querySelectorAll('[data-period]').forEach(el=>el.onclick=()=>{period=el.dataset.period;render()});
 document.querySelectorAll('[data-tip]').forEach(el=>{const show=()=>document.getElementById('readout').textContent=el.dataset.tip;el.onmouseenter=show;el.onfocus=show});
 const close=document.getElementById('close');if(close)close.onclick=()=>{selected=-1;render()};
 const input=document.getElementById('search');if(input)input.oninput=()=>{const pos=input.selectionStart;search=input.value;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)};
 const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('site',s.key);try{history.replaceState(null,'',url)}catch{};
}
function changeVariant(v){variant=v;search='';render()}
function cycle(delta){changeVariant(variants[(variants.indexOf(variant)+delta+3)%3])}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);
document.getElementById('variant').onchange=e=>changeVariant(e.target.value);
document.getElementById('site').onchange=e=>{siteIndex=Number(e.target.value);selected=-1;period='all';search='';render()};
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,button,[contenteditable]')||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script></body></html>
